<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#028090"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="10" fill="#028090"/><text x="60" y="72" font-size="36" font-weight="800" fill="#14323A">05 光阻液防呆系統架構</text><text x="60" y="108" font-size="19" fill="#5B7077">追蹤光阻液從回溫櫃到光阻工作站的狀態，防止誤用不同類型光阻</text><rect x="80" y="300" width="300" height="180" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="230.0" y="334" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">光阻液入庫</text><text x="230.0" y="370" font-size="17" fill="#5B7077" text-anchor="middle">瓶身條碼／標籤</text><text x="230.0" y="394" font-size="17" fill="#5B7077" text-anchor="middle">型號、批號、效期</text><rect x="470" y="300" width="300" height="180" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="620.0" y="334" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">回溫櫃</text><text x="620.0" y="370" font-size="17" fill="#5B7077" text-anchor="middle">各櫃數量與實際位置</text><text x="620.0" y="394" font-size="17" fill="#5B7077" text-anchor="middle">回溫時間管控</text><rect x="860" y="300" width="300" height="180" rx="14" fill="#028090" stroke="#028090" stroke-width="2.5"/><text x="1010.0" y="334" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">防呆比對</text><text x="1010.0" y="370" font-size="17" fill="#FFFFFF" text-anchor="middle">領用型號 vs 機台配方</text><text x="1010.0" y="394" font-size="17" fill="#FFFFFF" text-anchor="middle">不符即阻擋上機</text><rect x="1250" y="300" width="270" height="180" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="1385.0" y="334" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">光阻工作站</text><text x="1385.0" y="370" font-size="17" fill="#5B7077" text-anchor="middle">上機、用量紀錄</text><text x="1385.0" y="394" font-size="17" fill="#5B7077" text-anchor="middle">空瓶回收</text><line x1="382" y1="390" x2="468" y2="390" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><line x1="772" y1="390" x2="858" y2="390" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><line x1="1162" y1="390" x2="1248" y2="390" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="590" width="690" height="130" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="815.0" y="624" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">管理平台</text><text x="815.0" y="660" font-size="17" fill="#5B7077" text-anchor="middle">庫存即時可視、進出站狀態追蹤、異常警示與稽核紀錄</text><line x1="620" y1="485" x2="700" y2="585" stroke="#00A896" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><line x1="1010" y1="485" x2="930" y2="585" stroke="#00A896" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="80" y="790" font-size="19" fill="#C2410C" text-anchor="start" font-weight="700">為何重要：光阻塗佈品質直接影響微影良率；10cP 正光阻每公升約 NT$24 萬元，誤用與報廢成本高</text><line x1="60" y1="848" x2="1540" y2="848" stroke="#9FB7BC" stroke-width="1"/><text x="60" y="876" font-size="14" fill="#5B7077">來源：竹陞 2025 年報 p.72–73（光阻液防呆系統、10cP 正光阻每公升約 NT$24 萬元）</text><text x="1540" y="876" font-size="14" fill="#5B7077" text-anchor="end">竹陞 6739 工程圖解｜Kevin 研究 2026-10-02｜示意圖，非公司原圖</text></svg>