<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#028090"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="10" fill="#028090"/><text x="60" y="72" font-size="36" font-weight="800" fill="#14323A">03 GoVision 光阻塗佈製程 AI 感官監控</text><text x="60" y="108" font-size="19" fill="#5B7077">以塗佈顯影機（Track）為例：AI 視覺、聽覺、嗅覺同時監測，在製程中即時判斷</text><rect x="120" y="230" width="760" height="460" rx="18" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="140" y="262" font-size="18" fill="#5B7077" text-anchor="start" font-weight="400">塗佈顯影機台（示意）</text><ellipse cx="500" cy="520" rx="210" ry="38" fill="#D9ECEC" stroke="#028090" stroke-width="2.5"/><rect x="490" y="520" width="20" height="110" fill="#9FB7BC"/><text x="500" y="655" font-size="17" fill="#5B7077" text-anchor="middle" font-weight="400">旋轉夾頭（Spin Chuck）</text><rect x="470" y="330" width="60" height="90" rx="8" fill="#FFFFFF" stroke="#028090" stroke-width="2.5"/><line x1="500" y1="420" x2="500" y2="480" stroke="#028090" stroke-width="3" stroke-dasharray="5 5"/><text x="545" y="370" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">光阻噴嘴</text><path d="M180 470 L300 420 L360 470" fill="none" stroke="#14323A" stroke-width="6" stroke-linecap="round"/><text x="170" y="510" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">晶圓搬運機械手臂</text><circle cx="330" cy="440" r="16" fill="#02C39A" stroke="#FFFFFF" stroke-width="3"/><text x="330" y="416" font-size="16" fill="#028090" text-anchor="middle" font-weight="700">視覺①</text><circle cx="500" cy="505" r="16" fill="#02C39A" stroke="#FFFFFF" stroke-width="3"/><text x="500" y="481" font-size="16" fill="#028090" text-anchor="middle" font-weight="700">視覺②③</text><circle cx="240" cy="560" r="16" fill="#02C39A" stroke="#FFFFFF" stroke-width="3"/><text x="240" y="536" font-size="16" fill="#028090" text-anchor="middle" font-weight="700">聽覺</text><circle cx="760" cy="330" r="16" fill="#02C39A" stroke="#FFFFFF" stroke-width="3"/><text x="760" y="306" font-size="16" fill="#028090" text-anchor="middle" font-weight="700">嗅覺</text><path d="M740 300 q20 -30 40 0 q20 30 40 0" fill="none" stroke="#02C39A" stroke-width="3"/><rect x="930" y="230" width="590" height="80" rx="12" fill="#E6F4F4" stroke="#028090" stroke-width="2"/><text x="950" y="262" font-size="20" fill="#14323A" text-anchor="start" font-weight="700">AI 視覺①：手臂軌跡</text><text x="950" y="290" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">偵測搬運軌跡偏移，避免撞片與破片</text><rect x="930" y="322" width="590" height="80" rx="12" fill="#E6F4F4" stroke="#028090" stroke-width="2"/><text x="950" y="354" font-size="20" fill="#14323A" text-anchor="start" font-weight="700">AI 視覺②：晶圓水平／裂痕破片</text><text x="950" y="382" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">放片水平度、邊緣裂痕即時辨識</text><rect x="930" y="414" width="590" height="80" rx="12" fill="#E6F4F4" stroke="#028090" stroke-width="2"/><text x="950" y="446" font-size="20" fill="#14323A" text-anchor="start" font-weight="700">AI 視覺③：塗佈均勻度</text><text x="950" y="474" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">檢測光阻塗佈是否均勻（影響良率）</text><rect x="930" y="506" width="590" height="80" rx="12" fill="#E6F4F4" stroke="#028090" stroke-width="2"/><text x="950" y="538" font-size="20" fill="#14323A" text-anchor="start" font-weight="700">AI 聽覺：聲紋預警</text><text x="950" y="566" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">馬達、零件耗損前的震動異音，事前預警</text><rect x="930" y="598" width="590" height="80" rx="12" fill="#E6F4F4" stroke="#028090" stroke-width="2"/><text x="950" y="630" font-size="20" fill="#14323A" text-anchor="start" font-weight="700">AI 嗅覺：VOC 監控</text><text x="950" y="658" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">先進製程對揮發性有機物更敏感，即時回報</text><text x="930" y="720" font-size="17" fill="#C2410C" text-anchor="start" font-weight="400">已滿足客戶光阻塗佈製程 AI 影像辨識（軌跡追蹤）需求；GoVision 2025 年營收 2.58 億元，年增 353%</text><line x1="60" y1="848" x2="1540" y2="848" stroke="#9FB7BC" stroke-width="1"/><text x="60" y="876" font-size="14" fill="#5B7077">來源：竹陞 2025 年報 p.2、p.74（AI 機器視覺／聽覺／嗅覺）；設備結構為通用示意</text><text x="1540" y="876" font-size="14" fill="#5B7077" text-anchor="end">竹陞 6739 工程圖解｜Kevin 研究 2026-10-02｜示意圖，非公司原圖</text></svg>