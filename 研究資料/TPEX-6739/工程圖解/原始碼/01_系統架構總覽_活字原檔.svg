<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#028090"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="10" fill="#028090"/><text x="60" y="72" font-size="36" font-weight="800" fill="#14323A">01 竹陞智慧製造系統架構總覽</text><text x="60" y="108" font-size="19" fill="#5B7077">跨品牌機台 → 操作／感知層 → 邊緣運算 → 工廠系統；In-Process 即時判斷，減少資料回傳延遲</text><rect x="80" y="700" width="330" height="110" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="245.0" y="734" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">黃光／塗佈顯影</text><text x="245.0" y="770" font-size="17" fill="#5B7077" text-anchor="middle">Track、Scanner</text><rect x="445" y="700" width="330" height="110" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="610.0" y="734" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">蝕刻／薄膜</text><text x="610.0" y="770" font-size="17" fill="#5B7077" text-anchor="middle">Etch、CVD、PVD</text><rect x="810" y="700" width="330" height="110" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="975.0" y="734" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">先進封裝</text><text x="975.0" y="770" font-size="17" fill="#5B7077" text-anchor="middle">CoWoS、SoIC、FOPLP</text><rect x="1175" y="700" width="330" height="110" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="1340.0" y="734" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">量測／檢測</text><text x="1340.0" y="770" font-size="17" fill="#5B7077" text-anchor="middle">KLA 等量測機台</text><text x="555" y="668" font-size="18" fill="#5B7077" text-anchor="middle" font-weight="400">設備層：82 品牌、512 機型相容</text><text x="1540" y="128" font-size="15" fill="#5B7077" text-anchor="end" font-weight="400">應材約 70、Lam 約 64、TEL 約 58、KLA 約 39 種機型</text><rect x="80" y="450" width="450" height="170" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="305.0" y="484" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">GoBot＋iRPA（Agentic AI）</text><text x="305.0" y="520" font-size="17" fill="#5B7077" text-anchor="middle">機台 GUI 遠端／自動操作</text><text x="305.0" y="544" font-size="17" fill="#5B7077" text-anchor="middle">SOP 劇本、換刀、400+ 種 Alarm 排除</text><text x="305.0" y="568" font-size="17" fill="#5B7077" text-anchor="middle">營收占比 34%（2026 年 1–8 月）</text><rect x="575" y="450" width="450" height="170" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="800.0" y="484" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">GoVision（Agentic AI）</text><text x="800.0" y="520" font-size="17" fill="#5B7077" text-anchor="middle">AI 視覺：晶圓水平、裂痕破片、軌跡</text><text x="800.0" y="544" font-size="17" fill="#5B7077" text-anchor="middle">AI 聽覺：聲紋異常預警</text><text x="800.0" y="568" font-size="17" fill="#5B7077" text-anchor="middle">AI 嗅覺：VOC 微污染　占比 36%</text><rect x="1070" y="450" width="450" height="170" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="1295.0" y="484" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">AIoT＋iLinkPLC（Physical AI）</text><text x="1295.0" y="520" font-size="17" fill="#5B7077" text-anchor="middle">溫度、濕度、壓力、氣體感測</text><text x="1295.0" y="544" font-size="17" fill="#5B7077" text-anchor="middle">PLC 聯網、機台數據採集</text><text x="1295.0" y="568" font-size="17" fill="#5B7077" text-anchor="middle">營收占比 30%</text><line x1="305" y1="695" x2="305" y2="628" stroke="#00A896" stroke-width="3" marker-end="url(#ah)"/><line x1="800" y1="695" x2="800" y2="628" stroke="#00A896" stroke-width="3" marker-end="url(#ah)"/><line x1="1295" y1="695" x2="1295" y2="628" stroke="#00A896" stroke-width="3" marker-end="url(#ah)"/><rect x="80" y="250" width="1440" height="140" rx="14" fill="#028090" stroke="#028090" stroke-width="2.5"/><text x="800.0" y="284" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">邊緣運算智能系統（Gobot Edge）</text><text x="800.0" y="322" font-size="19" fill="#FFFFFF" text-anchor="middle">設備端即時異常分析（in Process）｜自動參數補償決策｜劇本管理｜節能模式（Green Mode）協同派貨</text><line x1="305" y1="445" x2="305" y2="398" stroke="#00A896" stroke-width="3" marker-end="url(#ah)"/><line x1="800" y1="445" x2="800" y2="398" stroke="#00A896" stroke-width="3" marker-end="url(#ah)"/><line x1="1295" y1="445" x2="1295" y2="398" stroke="#00A896" stroke-width="3" marker-end="url(#ah)"/><rect x="260" y="140" width="330" height="80" rx="14" fill="#FFFFFF" stroke="#028090" stroke-width="2.5"/><text x="425.0" y="188.4" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">工業 4.0 戰情室</text><rect x="635" y="140" width="330" height="80" rx="14" fill="#FFFFFF" stroke="#028090" stroke-width="2.5"/><text x="800.0" y="188.4" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">MES／EAP 上位機</text><rect x="1010" y="140" width="330" height="80" rx="14" fill="#FFFFFF" stroke="#028090" stroke-width="2.5"/><text x="1175.0" y="188.4" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">工程師遠端決策</text><line x1="425" y1="245" x2="425" y2="228" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><line x1="800" y1="245" x2="800" y2="228" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><line x1="1175" y1="245" x2="1175" y2="228" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><line x1="60" y1="848" x2="1540" y2="848" stroke="#9FB7BC" stroke-width="1"/><text x="60" y="876" font-size="14" fill="#5B7077">來源：竹陞 2025 年報 p.70–74（遠程智能操控、數據採集架構、GoVision）；2026-09-09 法說整理</text><text x="1540" y="876" font-size="14" fill="#5B7077" text-anchor="end">竹陞 6739 工程圖解｜Kevin 研究 2026-10-02｜示意圖，非公司原圖</text></svg>