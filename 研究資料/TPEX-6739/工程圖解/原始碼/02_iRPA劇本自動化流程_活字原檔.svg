<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#028090"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="10" fill="#028090"/><text x="60" y="72" font-size="36" font-weight="800" fill="#14323A">02 iRPA 劇本自動化流程（第三代遠程智能自動操控）</text><text x="60" y="108" font-size="19" fill="#5B7077">把人工 SOP 變成可平展到上千台機台的劇本；劇本越多，節省人力越顯著</text><rect x="60" y="260" width="270" height="170" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="195.0" y="294" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">① 錄製 SOP 影片</text><text x="195.0" y="330" font-size="17" fill="#5B7077" text-anchor="middle">產線工程師／操作員</text><text x="195.0" y="354" font-size="17" fill="#5B7077" text-anchor="middle">依既有 SOP 操作機台</text><line x1="332" y1="345" x2="358" y2="345" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="260" width="270" height="170" rx="14" fill="#028090" stroke="#028090" stroke-width="2.5"/><text x="495.0" y="294" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">② 影片自動轉劇本</text><text x="495.0" y="330" font-size="17" fill="#FFFFFF" text-anchor="middle">AI 解析畫面與動作</text><text x="495.0" y="354" font-size="17" fill="#FFFFFF" text-anchor="middle">編譯成可執行劇本</text><line x1="632" y1="345" x2="658" y2="345" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="660" y="260" width="270" height="170" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="795.0" y="294" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">③ 劇本驗證微調</text><text x="795.0" y="330" font-size="17" fill="#5B7077" text-anchor="middle">每台機台存在機差</text><text x="795.0" y="354" font-size="17" fill="#5B7077" text-anchor="middle">工程師快速微調上線</text><line x1="932" y1="345" x2="958" y2="345" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="960" y="260" width="270" height="170" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="1095.0" y="294" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">④ 平展至各機台</text><text x="1095.0" y="330" font-size="17" fill="#5B7077" text-anchor="middle">GoBot 執行劇本</text><text x="1095.0" y="354" font-size="17" fill="#5B7077" text-anchor="middle">取代人員介入與移動</text><line x1="1232" y1="345" x2="1258" y2="345" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="1260" y="260" width="270" height="170" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="1395.0" y="294" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">⑤ 工廠劇本管理</text><text x="1395.0" y="330" font-size="17" fill="#5B7077" text-anchor="middle">上千台機台、無數劇本</text><text x="1395.0" y="354" font-size="17" fill="#5B7077" text-anchor="middle">集中版本與維運管理</text><line x1="1335" y1="435" x2="1335" y2="560" stroke="#00A896" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><line x1="1335" y1="560" x2="195" y2="560" stroke="#00A896" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="765.0" y="545" font-size="16" fill="#5B7077" text-anchor="middle">異常與新 Alarm 回饋 → 擴充劇本庫（400+ 種 Alarm 排除）</text><line x1="195" y1="560" x2="195" y2="438" stroke="#00A896" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><rect x="60" y="620" width="700" height="160" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="410.0" y="654" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">解決的痛點</text><text x="410.0" y="690" font-size="17" fill="#5B7077" text-anchor="middle">24 小時運轉、缺工，人員須穿無塵衣進出</text><text x="410.0" y="714" font-size="17" fill="#5B7077" text-anchor="middle">人為操作異常風險；機台單價 1–50 億元</text><text x="410.0" y="738" font-size="17" fill="#5B7077" text-anchor="middle">一片晶圓價值可達 100 萬美元，客戶在意良率與產能</text><rect x="840" y="620" width="700" height="160" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="1190.0" y="654" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">技術門檻</text><text x="1190.0" y="690" font-size="17" fill="#5B7077" text-anchor="middle">跨品牌 GUI 與控制環境（Windows／Linux／UNIX／PLC）</text><text x="1190.0" y="714" font-size="17" fill="#5B7077" text-anchor="middle">與上位機雙向即時通訊、權限與資安</text><text x="1190.0" y="738" font-size="17" fill="#5B7077" text-anchor="middle">需半導體製程 know-how 才寫得出可用劇本</text><line x1="60" y1="848" x2="1540" y2="848" stroke="#9FB7BC" stroke-width="1"/><text x="60" y="876" font-size="14" fill="#5B7077">來源：竹陞 2025 年報 p.74（iRPA A–F 功能說明）</text><text x="1540" y="876" font-size="14" fill="#5B7077" text-anchor="end">竹陞 6739 工程圖解｜Kevin 研究 2026-10-02｜示意圖，非公司原圖</text></svg>