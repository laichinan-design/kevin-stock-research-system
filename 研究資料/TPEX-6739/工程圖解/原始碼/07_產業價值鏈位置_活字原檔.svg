<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#028090"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="10" fill="#028090"/><text x="60" y="72" font-size="36" font-weight="800" fill="#14323A">07 產業價值鏈位置：設備原廠與晶圓廠之間的「後裝智慧化層」</text><text x="60" y="108" font-size="19" fill="#5B7077">竹陞不賣機台，在既有多品牌機台上加裝操作、感知與 AI 判斷；跨品牌整合是護城河</text><rect x="60" y="220" width="420" height="230" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="270.0" y="254" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">上游</text><text x="270.0" y="290" font-size="17" fill="#5B7077" text-anchor="middle">感測器、相機、麥克風、氣體感測</text><text x="270.0" y="314" font-size="17" fill="#5B7077" text-anchor="middle">工業電腦、邊緣運算硬體</text><text x="270.0" y="338" font-size="17" fill="#5B7077" text-anchor="middle">PLC、網通元件</text><text x="270.0" y="362" font-size="17" fill="#5B7077" text-anchor="middle">（原料與外包供應商）</text><rect x="590" y="200" width="420" height="270" rx="14" fill="#028090" stroke="#028090" stroke-width="2.5"/><text x="800.0" y="234" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">竹陞 6739</text><text x="800.0" y="270" font-size="17" fill="#FFFFFF" text-anchor="middle">軟硬整合＋劇本／AI 模型</text><text x="800.0" y="294" font-size="17" fill="#FFFFFF" text-anchor="middle">跨 82 品牌、512 機型</text><text x="800.0" y="318" font-size="17" fill="#FFFFFF" text-anchor="middle">毛利率 66–68%</text><text x="800.0" y="342" font-size="17" fill="#FFFFFF" text-anchor="middle">營益率 58%（2026Q2）</text><rect x="1120" y="220" width="420" height="230" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="1330.0" y="254" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">下游客戶</text><text x="1330.0" y="290" font-size="17" fill="#5B7077" text-anchor="middle">晶圓代工（台系大廠）</text><text x="1330.0" y="314" font-size="17" fill="#5B7077" text-anchor="middle">記憶體（美系大廠，長約）</text><text x="1330.0" y="338" font-size="17" fill="#5B7077" text-anchor="middle">先進封裝／OSAT</text><text x="1330.0" y="362" font-size="17" fill="#5B7077" text-anchor="middle">PCB、面板（少量）</text><line x1="482" y1="335" x2="586" y2="335" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><line x1="1012" y1="335" x2="1116" y2="335" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="560" width="420" height="170" rx="14" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5"/><text x="800.0" y="594" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">設備原廠</text><text x="800.0" y="630" font-size="17" fill="#5B7077" text-anchor="middle">Applied Materials、Lam、TEL、KLA</text><text x="800.0" y="654" font-size="17" fill="#5B7077" text-anchor="middle">機台本體；可能自行智慧化</text><line x1="800" y1="556" x2="800" y2="476" stroke="#C2410C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="930" y="520" font-size="16" fill="#5B7077" text-anchor="middle">相容整合／潛在替代</text><rect x="1120" y="560" width="420" height="170" rx="14" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5"/><text x="1330.0" y="594" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">替代與競爭</text><text x="1330.0" y="630" font-size="17" fill="#5B7077" text-anchor="middle">晶圓廠自研智慧製造</text><text x="1330.0" y="654" font-size="17" fill="#5B7077" text-anchor="middle">Siemens、Rockwell 等工業 AI</text><text x="1330.0" y="678" font-size="17" fill="#5B7077" text-anchor="middle">盟立、迅得（搬運／整線，重疊低）</text><rect x="60" y="560" width="420" height="170" rx="14" fill="#F4F7F8" stroke="#9FB7BC" stroke-width="2.5"/><text x="270.0" y="594" font-size="24" font-weight="700" fill="#14323A" text-anchor="middle">需求驅動</text><text x="270.0" y="630" font-size="17" fill="#5B7077" text-anchor="middle">AI 帶動先進製程、HBM、CoWoS 擴產</text><text x="270.0" y="654" font-size="17" fill="#5B7077" text-anchor="middle">缺工與 24 小時無人化</text><text x="270.0" y="678" font-size="17" fill="#5B7077" text-anchor="middle">預測性維護由選配轉標配</text><line x1="60" y1="848" x2="1540" y2="848" stroke="#9FB7BC" stroke-width="1"/><text x="60" y="876" font-size="14" fill="#5B7077">來源：竹陞 2025 年報 p.75（產業上中下游關聯圖）、法說會；競爭者為研究推論</text><text x="1540" y="876" font-size="14" fill="#5B7077" text-anchor="end">竹陞 6739 工程圖解｜Kevin 研究 2026-10-02｜示意圖，非公司原圖</text></svg>