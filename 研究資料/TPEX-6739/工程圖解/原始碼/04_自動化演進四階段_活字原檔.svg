<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#028090"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="10" fill="#028090"/><text x="60" y="72" font-size="36" font-weight="800" fill="#14323A">04 機台監控自動化演進：從人看機台到 AI 代理</text><text x="60" y="108" font-size="19" fill="#5B7077">竹陞產品線對應的四個階段；越往右，人員介入越少、單機價值越高</text><rect x="60" y="520" width="345" height="200" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="232.5" y="554" font-size="22" font-weight="700" fill="#14323A" text-anchor="middle">階段 1｜IoT 數據採集</text><text x="232.5" y="590" font-size="17" fill="#5B7077" text-anchor="middle">感測器收集溫濕度、壓力、氣體</text><text x="232.5" y="614" font-size="17" fill="#5B7077" text-anchor="middle">人員仍須進無塵室看機台</text><text x="232.5" y="638" font-size="17" fill="#5B7077" text-anchor="middle">產品：AIoT、iLinkPLC</text><line x1="407" y1="620" x2="433" y2="550" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="435" y="450" width="345" height="200" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="607.5" y="484" font-size="22" font-weight="700" fill="#14323A" text-anchor="middle">階段 2｜RCM 遠端監看</text><text x="607.5" y="520" font-size="17" fill="#5B7077" text-anchor="middle">不必穿無塵衣，辦公室遠端看</text><text x="607.5" y="544" font-size="17" fill="#5B7077" text-anchor="middle">人力約省一半（報導）</text><text x="607.5" y="568" font-size="17" fill="#5B7077" text-anchor="middle">產品：遠程智能操控系統</text><line x1="782" y1="550" x2="808" y2="480" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="810" y="380" width="345" height="200" rx="14" fill="#E6F4F4" stroke="#028090" stroke-width="2.5"/><text x="982.5" y="414" font-size="22" font-weight="700" fill="#14323A" text-anchor="middle">階段 3｜GoBot＋iRPA 代操</text><text x="982.5" y="450" font-size="17" fill="#5B7077" text-anchor="middle">機器依劇本代看、代操作</text><text x="982.5" y="474" font-size="17" fill="#5B7077" text-anchor="middle">人力約省 90%（報導）</text><text x="982.5" y="498" font-size="17" fill="#5B7077" text-anchor="middle">產品：GoBot、iRPA</text><line x1="1157" y1="480" x2="1183" y2="410" stroke="#028090" stroke-width="3" marker-end="url(#ah)"/><rect x="1185" y="310" width="345" height="200" rx="14" fill="#028090" stroke="#028090" stroke-width="2.5"/><text x="1357.5" y="344" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">階段 4｜Agentic／Physical AI</text><text x="1357.5" y="380" font-size="17" fill="#FFFFFF" text-anchor="middle">AI 感官即時判斷、自動補償參數</text><text x="1357.5" y="404" font-size="17" fill="#FFFFFF" text-anchor="middle">預測性維護由選配轉標配</text><text x="1357.5" y="428" font-size="17" fill="#FFFFFF" text-anchor="middle">產品：GoVision、Gobot Edge</text><line x1="60" y1="790" x2="1540" y2="790" stroke="#9FB7BC" stroke-width="2"/><text x="60" y="820" font-size="17" fill="#5B7077" text-anchor="start" font-weight="400">人員介入：高</text><text x="1540" y="820" font-size="17" fill="#5B7077" text-anchor="end" font-weight="400">人員介入：低｜單機產值：高</text><text x="60" y="200" font-size="19" fill="#14323A" text-anchor="start" font-weight="700">2025 年營收結構：智能自動操作系統 36.5%｜製程數據採集 IoT 31.4%｜GoVision 32.0%（GoVision 由 13.9% 跳升）</text><line x1="60" y1="848" x2="1540" y2="848" stroke="#9FB7BC" stroke-width="1"/><text x="60" y="876" font-size="14" fill="#5B7077">來源：竹陞 2025 年報 p.72（數據採集資訊進階程序）；人力節省比例取自金融阮實力產業報導（非公司揭露）</text><text x="1540" y="876" font-size="14" fill="#5B7077" text-anchor="end">竹陞 6739 工程圖解｜Kevin 研究 2026-10-02｜示意圖，非公司原圖</text></svg>